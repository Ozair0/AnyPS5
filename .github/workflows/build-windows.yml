name: Build AnyPS5 Windows Relinker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 and build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build relinker only
        shell: msys2 {0}
        run: |
          cmake --build build --target relinker --parallel 4

      - name: Collect relinker
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/core/relinker/relinker.exe dist/relinker.exe
          ls -lh dist/relinker.exe

      - name: Upload Windows relinker
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5-Windows-Relinker
          path: dist/relinker.exe
          if-no-files-found: error
          retention-days: 7
