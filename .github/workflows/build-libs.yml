name: Build GOW AnyPS5 Runtime and Relinker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libs.yml'

jobs:
  libraries:
    runs-on: windows-latest
    steps:
      - name: Checkout game-specific AnyPS5 fork with submodules
        uses: actions/checkout@v4
        with:
          repository: nahshongraham97/AnyPS5
          ref: main
          submodules: recursive

      - name: Download exact WinLibs toolchain required by AnyPS5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "$env:RUNNER_TEMP\winlibs-gcc15.zip"
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r7/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip"
          & curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "WinLibs download failed" }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP\winlibs" -Force
          $bin = "$env:RUNNER_TEMP\winlibs\mingw64\bin"
          if (!(Test-Path "$bin\g++.exe")) { throw "GCC 15.2 not found at $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Prepare trusted CA bundle for CMake downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "cacert.pem"
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile $bundle
          if (!(Test-Path $bundle) -or (Get-Item $bundle).Length -lt 100000) { throw "CA bundle download invalid" }
          "CMAKE_TLS_CAINFO=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SSL_CERT_FILE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CURL_CA_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure with pinned compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "$env:RUNNER_TEMP\winlibs\mingw64\bin"
          $env:PATH = "$bin;$env:PATH"
          & "$bin\g++.exe" --version
          & "$bin\cmake.exe" -S . -B build-libs -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=$bin\gcc.exe" "-DCMAKE_CXX_COMPILER=$bin\g++.exe" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build game-specific runtime and relinker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "$env:RUNNER_TEMP\winlibs\mingw64\bin"
          $env:PATH = "$bin;$env:PATH"
          & "$bin\cmake.exe" --build build-libs --target relinker libs --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Library build failed" }

      - name: Package libraries and runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/libs | Out-Null
          Copy-Item build-libs/core/libs/libs/*.prx dist/libs/
          Copy-Item build-libs/core/relinker/relinker.exe dist/relinker.exe
          $bin = "$env:RUNNER_TEMP\winlibs\mingw64\bin"
          foreach ($name in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
            $from = Join-Path $bin $name
            if (Test-Path $from) { Copy-Item $from dist/libs/ }
          }
          foreach ($name in @("libSceHttp2.prx", "libc.prx", "libkernel.prx")) {
            if (!(Test-Path "dist/libs/$name")) { throw "Missing $name" }
          }
          if (!(Test-Path 'dist/relinker.exe')) { throw 'Missing relinker.exe' }
          Get-ChildItem dist/libs | Measure-Object | Select-Object -ExpandProperty Count

      - name: Upload Windows runtime libraries
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5-GOW-Windows-Matched-Build
          path: dist/
          if-no-files-found: error
          retention-days: 7
