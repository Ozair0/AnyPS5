name: Build AnyPS5 Windows Libraries (GCC)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libs.yml'

jobs:
  libraries:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Switch from Clang64: AnyPS5 currently uses GCC-only
      # __builtin_sysv_va_list / __builtin_sysv_va_start builtins.
      # Try MINGW64's exception runtime instead of UCRT64 GCC 16.
      - name: Install MinGW64 GCC toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-binutils

      - name: Configure
        shell: msys2 {0}
        run: |
          g++ --version
          cmake -S . -B build-libs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTING=OFF

      - name: Build runtime libraries
        shell: msys2 {0}
        run: |
          cmake --build build-libs --target libs --parallel 4

      - name: Package runtime libraries
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/libs
          cp build-libs/core/libs/libs/*.prx dist/libs/
          for dll in /mingw64/bin/libgcc_s_seh-1.dll /mingw64/bin/libstdc++-6.dll /mingw64/bin/libwinpthread-1.dll; do
            if test -f "$dll"; then cp "$dll" dist/libs/; fi
          done
          test -f dist/libs/libSceHttp2.prx
          test -f dist/libs/libc.prx
          ls -lh dist/libs/libSceHttp2.prx
          echo "Total packaged files:"
          find dist/libs -maxdepth 1 -type f | wc -l

      - name: Upload Windows libraries
        uses: actions/upload-artifact@v4
        with:
          name: AnyPS5-Windows-Libraries-GCC
          path: dist/
          if-no-files-found: error
          retention-days: 7
